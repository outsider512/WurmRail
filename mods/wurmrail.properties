classname=org.wurmrail.WurmRailMod
classpath=wurmrail.jar
sharedClassLoader=true

# Access lists: * allows all players; use comma-separated character names to restrict access.
# GMs with power 2+ always have access. Vehicle locks and Wurm permissions still apply.
builders=*
operators=*
maxCars=8
maxNodes=10000
# Trestle surveys. One tile is four metres.
trestleMaxTiles=250
# Rise over horizontal run in percent. 50% is 20 dirt over one 4 m cardinal tile.
trestleMaxGradientPercent=50
trestleBentSpacingTiles=3
# Minimum radius for new waypoint surveys, in tiles (3 to 500).
trestleMinCurveRadiusTiles=3
# metres per second (hard maximum 6)
maxSpeed=5.0
# Resume only scheduled services whose operator last left them running.
autoResumeScheduled=true
# Default for newly configured freight stops, kg per second; each stop can override it.
freightTransferKgPerSecond=100
# Seconds per Steam Rock Drill mining action. No offline catch-up; new starts earn a full interval.
steamRockDrillIntervalSeconds=30
# Seconds per Steam Yarder harvest opportunity. Wurm alone advances tree age; no offline catch-up.
steamYarderIntervalSeconds=30
# Default litres per second for new stored-water LOAD/UNLOAD freight stops.
waterFreightLitresPerSecond=100
# Steam Water Pump production rate; no pressure simulation or offline catch-up.
steamWaterPumpLitresPerSecond=100
# Steam input energy values per kilogram. Higher-grade fuel supplies more work.
steamWoodEnergyPerKg=1
steamCharcoalEnergyPerKg=3
steamCoalEnergyPerKg=6
# Work costs; Yarders consume only for actual harvest/replant work.
steamDrillEnergyPerAction=10
steamDrillWaterLitresPerAction=10
steamYarderEnergyPerAction=10
steamYarderWaterLitresPerAction=5
steamPumpEnergyPerLitre=0.02
# Paid internal buffers and explicit supply-link range in metres.
steamFuelBufferEnergy=60
steamWaterBufferLitres=100
steamSupplyLinkMetres=16
